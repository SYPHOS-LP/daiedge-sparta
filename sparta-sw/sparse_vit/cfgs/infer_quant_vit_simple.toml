device = "cuda"
use_wandb = true

[dataset]
name = "cifar10"                                    # {'cifar10', 'dir'}
path = "/home/anousias/Documents/Datasets/cifar10"  # Path to actual data 

# Optionally use a dataloader
[dataset.dataloader]
batch_size = 8
shuffle = false
num_workers = 0
drop_last = false

[model]
path = "/home/anousias/Documents/Projects/daiedge/sparta-sw/models/quantized/vit-base-cifar10-b16-finetuned-pruned-quant-ce9wm7ax.pth"

[quant]
method = "brevitas_ptq" # OPTIONS: "static", "gptq", "brevitas_ptq"

quant_scope = "all_conv2d" # Options: "all_conv2d", "pruned_conv2d"
eval_verbose = true
eval_log_interval = 10
calibrate_steps = 16
use_gptq = true
qat = true
bits = 4
abits = 8
weight_per_tensor = true # false = per-channel weight scales (recommended); true = one scale per tensor
use_int_norm = false
fuse_rms_norm = true     # fold each ln_mha/ln_mlp/head-ln gamma into the following linear before quantizing
weight_scale_po2 = true  # restrict Linear/Conv2d weight quantizer scales to powers of two (shift instead of multiply)
act_scale_po2 = true    # same restriction, applied to every activation quantizer
export_qonnx = false     # set to false to skip QONNX export

[infer.model.embed]
embed_type = "rgb"
img_size = 224
p_size = 16 # This controls 16 vs 32 patch size
channels = 3
use_cls = true
use_dstl = false
use_regs = 0
pe_type = "haar"

[infer.model.encoder]
mode = "vit"
N = 12
h = 12
d_in = 768
d_hid = 3072
activation = "relu"
bias = false
attn_type = "linear"
norm_type = "rms_norm"
dropout = 0.05
dropout_attn = 0.05
ffn_type = "mlp"

[infer.model.task]
num_classes = 10

[other.log]
log_sparsity = true

[wandb]
WANDB_MODE = "online"                    # Options: 'online', 'offline', 'disabled'
name = "vit-base-cifar10-b16-finetuned-pruned-quant-final"

[wandb.init]
project = "sparta-sw"
entity = "anousias-k3y"
