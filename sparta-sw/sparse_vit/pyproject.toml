[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparta-sw"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [
    { name = "Akis Nousias", email = "nousiasx@gmail.com" },
    { name = "Panos Roditis", email = "pkroditis@gmail.com" },
]
maintainers = [
    { name = "Akis Nousias", email = "nousiasx@gmail.com" },
    { name = "Panos Roditis", email = "pkroditis@gmail.com" },
]
dependencies = [
    "torch>=2.0.0,<2.13",
    "numpy>=1.20.0",
    "scikit-learn>=1.4.0",
    "torchvision",
    "opencv-python>=4.8.0",
    "toml>=0.10",
    "datasets==4.7.0",
    "wandb>=0.17.0",
    "entmax==1.3",
    "einops==0.8.2",
    "matplotlib>=3.10.9",
    "plotly==6.7.0",
    "brevitas==0.13.0",
    "onnx==1.22.0",
    "brevitas-utils@git+https://github.com/V0XNIHILI/brevitas-utils.git",
]

[project.scripts]
train-vit = "bin.train_vit:main"
infer-vit = "bin.infer_vit:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
