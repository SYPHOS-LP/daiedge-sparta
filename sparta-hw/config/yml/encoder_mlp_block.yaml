# ============================================================================
# Encoder MLP block configuration
#
# Independent component config: owns ONLY the block's own config (dims).
# The generated header pulls in ap_int.h/ap_fixed.h, plus the one sanctioned
# cross-component include (encoder_types.h, see `includes:` below).
#
# See inc/top/encoder_mlp_block.h for the block's functionality.
#
# Generated to config/inc/encoder_mlp_block_cfg.h by scripts/gen_layer_config.py.
# ============================================================================

# The residual working value is the shared T_Scale (config/inc/encoder_types.h).
includes:
  - encoder_types.h

defines:
  # layer dimensions (MAX for buffer sizing; actual counts are runtime args)
  - { name: ENC_MLP_FEATURE_W_MAX, value: 768, comment: "maximum feature width (rows, feature-major layout)" }
  - { name: ENC_MLP_TOKEN_W_MAX,   value: 50,  comment: "maximum token width (columns)" }
