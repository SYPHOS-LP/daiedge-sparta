# ============================================================================
# MHA (linear self-attention) component configuration
#
# Independent component config: owns ONLY the MHA's own types + constants.
# The generated header pulls in ap_int.h/ap_fixed.h, plus the one sanctioned
# cross-component include (encoder_types.h, see `includes:` below).
#
# See inc/layers/mha.h for the layer's functionality.
#
# Generated to config/inc/mha_cfg.h by scripts/gen_layer_config.py.
# ============================================================================

includes:
  - encoder_types.h

defines:
  # --- layer dimensions (MAX for buffer sizing; actual counts are runtime args) ---
  - { name: MHA_FEATURE_W_MAX, value: 768, comment: "maximum feature width (rows, feature-major layout)" }
  - { name: MHA_TOKEN_W_MAX,   value: 50, comment: "maximum token width (columns)" }
  - { name: MHA_N_HEADS,       value: 12,  comment: "attention heads" }
  - { name: MHA_FEATURE_HEAD,  value: 64,  comment: "per-head feature width (MHA_FEATURE_W_MAX / MHA_N_HEADS)" }

  # --- on-chip CSR capacity for Q'/K' ---
  - { name: MHA_MAX_QK_NNZ, value: 38400, comment: "Q'/K' CSR cache capacity" }

  # --- Q'/K' per-head stream buffer depth (streaming/double-buffer design) ---
  # Sized to the fully-dense per-head slice (MHA_FEATURE_HEAD * MHA_TOKEN_W_MAX),
  # so even 100% ReLU survival fits and the slice can never overflow.
  - { name: MHA_KP_STREAM_NNZ, value: "(MHA_FEATURE_HEAD * MHA_TOKEN_W_MAX)", comment: "per-head K' slice buffer = fully-dense slice (64*197); never overflows" }
  - { name: MHA_QP_STREAM_NNZ, value: "(MHA_FEATURE_HEAD * MHA_TOKEN_W_MAX)", comment: "per-head Q' slice buffer = fully-dense slice (64*197); never overflows" }

  # --- MHA weight-row decode buffer bound -----
  - { name: MHA_MAX_W_NNZ, value: 256, comment: "per-row weight-decode buffer depth (measured max 195)" }

  # --- on-chip weight-buffer capacity for a full dense projection weight ---
  - { name: MHA_MAX_W_TOTAL_NNZ, value: 58980, comment: "on-chip full-weight CSR capacity for a dense projection" }

  # --- sparse format guard (mha-scoped) ---
  - { name: MHA_SPARSE_FORMAT_CSR, value: 1, comment: "CSR format guard for the MHA decode paths" }

  # --- reciprocal LUT (sibling of the rsqrt LUT; dedicated BRAM ROM) -----------
  - { name: MHA_RECIP_LUT_ADDR_BITS, value: 8, comment: "256 entries" }
  - { name: MHA_RECIP_LUT_SIZE,      value: "(1 << MHA_RECIP_LUT_ADDR_BITS)" }

  # --- banked activation tier in PACKED URAM (frees the cyclic-partitioned BRAM) ---
  - { name: MHA_BANK_PACK,      value: 8, comment: "int8 lanes packed per URAM word (64-bit)" }
  - { name: MHA_ACT_ELEM_BITS,  value: 8, comment: "activation bit width (int8)" }
  - { name: MHA_BANK_WORD_BITS, value: "(MHA_BANK_PACK * MHA_ACT_ELEM_BITS)", comment: "64-bit packed bank word" }
  - { name: MHA_BANK_PAD_TOK,   value: "(((MHA_TOKEN_W_MAX + MHA_BANK_PACK - 1) / MHA_BANK_PACK) * MHA_BANK_PACK)", comment: "tokens padded up to a multiple of MHA_BANK_PACK (197->200)" }
  - { name: MHA_BANK_ROW_WORDS, value: "(MHA_BANK_PAD_TOK / MHA_BANK_PACK)", comment: "packed words per feature row (200/8=25)" }
  - { name: MHA_BANK_WORDS,     value: "(MHA_FEATURE_W_MAX * MHA_BANK_ROW_WORDS)", comment: "total packed words in the bank (768*25)" }
  - { name: MHA_MAC_UNROLL,     value: 16, comment: "on-chip MAC lanes over tokens + accumulator partition" }
  - { name: MHA_BANK_CYCLIC,    value: "(MHA_MAC_UNROLL / MHA_BANK_PACK)", comment: "word-array cyclic factor = words per MAC-wide read (16/8=2)" }

  # --- on-chip scratch array sizes (Q'/K' CSR + per-head working state) ----------
  - { name: MHA_SCR_QP_VAL_CNT, value: MHA_MAX_QK_NNZ, comment: "Q' values (int8); mirrors MHA_MAX_QK_NNZ" }
  - { name: MHA_SCR_QP_COL_CNT, value: MHA_MAX_QK_NNZ, comment: "Q' col indices (head features 0..63)" }
  - { name: MHA_SCR_QP_PTR_CNT, value: "(MHA_N_HEADS * (MHA_TOKEN_W_MAX + 1))", comment: "Q' HEAD-MAJOR row_ptr: 12 blocks of (n+1); head h token-major spans in block h" }
  - { name: MHA_SCR_KP_VAL_CNT, value: MHA_MAX_QK_NNZ, comment: "K' values (int8); mirrors MHA_MAX_QK_NNZ" }
  - { name: MHA_SCR_KP_COL_CNT, value: MHA_MAX_QK_NNZ, comment: "K' col indices (tokens 0..196)" }
  - { name: MHA_SCR_KP_PTR_CNT, value: "(MHA_FEATURE_W_MAX + 1)", comment: "K' feature-major row_ptr (D+1)" }
  - { name: MHA_SCR_V_CNT,      value: "(MHA_FEATURE_W_MAX * MHA_TOKEN_W_MAX)", comment: "V dense D x N (int8)" }
  - { name: MHA_SCR_A_CNT,      value: "(MHA_FEATURE_HEAD * MHA_FEATURE_HEAD)", comment: "per-head A = K'V^T (int32)" }

  # --- loop tripcounts: latency ESTIMATION only (90% weight + activation sparsity)
  - { name: MHA_TC_FEATURE,      value: 768, comment: "feature rows (projections)" }
  - { name: MHA_TC_TOKEN,        value: 50, comment: "tokens / dense width" }
  - { name: MHA_TC_FEATURE_HEAD, value: 64,  comment: "per-head width" }
  - { name: MHA_TC_W_NNZ,        value: 77,  comment: "nonzeros per projection weight row (~10% of D)" }
  - { name: MHA_TC_QP_NNZ,       value: 7,   comment: "Q' nonzeros per token-row (~10% of d_head=64)" }
  - { name: MHA_TC_KP_NNZ,       value: 5,  comment: "K' nonzeros per feature-row (~10% of n=50)" }

types:
  - { name: T_MhaWVal,  kind: ap_int,   width: 4,            comment: "on-chip decoded W value buffer (w4 weight, -7..+7)" }
  - { name: T_MhaIndex, kind: ap_uint,  width: 16,           comment: "DDR weight-CSR col index (dims < 65536; 16-bit keeps the AXI burst byte-aligned)" }
  - { name: T_MhaWCol,  kind: ap_uint,  width: 10,           comment: "on-chip decoded W col buffer (feature < MHA_FEATURE_W_MAX=768)" }
  - { name: T_MhaHeadIndex, kind: ap_uint, width: 8,         comment: "Q'/K' CSR col idx: K'=token(0..196), Q'=BAND-LOCAL feature(0..63) after head-major emit -> both fit 8 bits" }
  - { name: T_MhaBankWord, kind: ap_uint, width_expr: "MHA_BANK_WORD_BITS", comment: "packed bank URAM word: MHA_BANK_PACK int8 activations (64-bit)" }
  - { name: T_MhaAcc,   kind: ap_int,   width: 32,           comment: "MAC / scatter accumulator (int8xint8 summed)" }
  - { name: T_MhaRecip, kind: ap_ufixed, total: 32, int: 1,  comment: "1/(d+eps) reciprocal LUT output; d is large so recip ~1e-6, needs many frac bits" }
  - { name: T_MhaDiv,   kind: ap_fixed, total: 32, int: 16,  comment: "N*recip ~= N/d ratio (O(1)) before requant" }
