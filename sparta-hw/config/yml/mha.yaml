# ============================================================================
# MHA (linear self-attention) component configuration
#
# Independent component config: owns ONLY the MHA's own types + constants.
# The generated header pulls in ap_int.h/ap_fixed.h, plus the one sanctioned
# cross-component include (encoder_types.h, see `includes:` below).
#
# See inc/layers/mha.h for the layer's functionality.
#
# Generated to config/inc/mha_cfg.h by scripts/gen_layer_config.py.
# ============================================================================

includes:
  - encoder_types.h

defines:
  # --- layer dimensions (MAX for buffer sizing; actual counts are runtime args) ---
  - { name: MHA_FEATURE_W_MAX, value: 768, comment: "maximum feature width (rows, feature-major layout)" }
  - { name: MHA_TOKEN_W_MAX,   value: 50, comment: "maximum token width (columns)" }
  - { name: MHA_N_HEADS,       value: 12,  comment: "attention heads" }
  - { name: MHA_FEATURE_HEAD,  value: 64,  comment: "per-head feature width (MHA_FEATURE_W_MAX / MHA_N_HEADS)" }

  # --- on-chip capacity for one head's Q'/K' CSR and dense V ---
  # Q', K' and V are computed and consumed one head at a time, so these hold MHA_FEATURE_HEAD x N.
  # Sized for 100% ReLU survival, which makes overflow impossible without relying on measured
  # densities (measured peak: Q' 0.45, K' 0.39 in layer 0).
  - { name: MHA_HEAD_NNZ_MAX,  value: "(MHA_FEATURE_HEAD * MHA_TOKEN_W_MAX)", comment: "per-head Q'/K' CSR capacity = fully dense head slice (64*50)" }
  - { name: MHA_SCR_V_HEAD_CNT, value: "(MHA_FEATURE_HEAD * MHA_TOKEN_W_MAX)", comment: "one head's dense V, and the Q' transpose scratch (int8)" }

  # --- MHA weight-row decode buffer bound -----
  - { name: MHA_MAX_W_NNZ, value: 256, comment: "per-row weight-decode buffer depth (measured max 195)" }

  # --- sparse format guard (mha-scoped) ---
  - { name: MHA_SPARSE_FORMAT_CSR, value: 1, comment: "CSR format guard for the MHA decode paths" }

  # --- reciprocal LUT (sibling of the rsqrt LUT; dedicated BRAM ROM) -----------
  - { name: MHA_RECIP_LUT_ADDR_BITS, value: 8, comment: "256 entries" }
  - { name: MHA_RECIP_LUT_SIZE,      value: "(1 << MHA_RECIP_LUT_ADDR_BITS)" }

  # --- banked activation tier in PACKED URAM (frees the cyclic-partitioned BRAM) ---
  - { name: MHA_BANK_PACK,      value: 8, comment: "tokens packed per activation word: one word is the vector a weight is applied to, so this sets how many multiply-accumulates a lane does per cycle" }
  - { name: MHA_ACT_ELEM_BITS,  value: 8, comment: "activation bit width (int8)" }
  - { name: MHA_BANK_WORD_BITS, value: "(MHA_BANK_PACK * MHA_ACT_ELEM_BITS)", comment: "64-bit packed bank word" }
  - { name: MHA_BANK_PAD_TOK,   value: "(((MHA_TOKEN_W_MAX + MHA_BANK_PACK - 1) / MHA_BANK_PACK) * MHA_BANK_PACK)", comment: "tokens padded up to a multiple of MHA_BANK_PACK (197->200)" }
  - { name: MHA_BANK_ROW_WORDS, value: "(MHA_BANK_PAD_TOK / MHA_BANK_PACK)", comment: "packed words per feature row (200/8=25)" }
  - { name: MHA_BANK_WORDS,     value: "(MHA_FEATURE_W_MAX * MHA_BANK_ROW_WORDS)", comment: "total packed words in the bank (768*25)" }
  - { name: MHA_MAC_UNROLL,     value: 16, comment: "on-chip MAC lanes over tokens + accumulator partition" }
  - { name: MHA_BANK_CYCLIC,    value: "(MHA_MAC_UNROLL / MHA_BANK_PACK)", comment: "word-array cyclic factor = words per MAC-wide read (16/8=2)" }
  - { name: MHA_BANK_WORDS_ALLOC, value: "(MHA_BANK_WORDS + MHA_BANK_CYCLIC - 1)", comment: "bank array size read by the SpMM: + the spare word(s) the last token tile reads past the final row (value unused)" }

  # --- tiled SpMM: the feature axis is split into MHA_TILES column blocks -------------
  # Each block has its own activation tile (one BRAM36: MHA_TILE_WORDS x 64 b) and its own
  # weight bank (one URAM), so MHA_TILES lanes each read one nonzero per cycle without any
  # copy of the activation.  compile_model.py --mha-tiles emits the weights to match.
  - { name: MHA_TILES,          value: 12, comment: "column blocks of the feature axis (= heads at D=768)" }
  - { name: MHA_TILE_FEATURES,  value: "(MHA_FEATURE_W_MAX / MHA_TILES)", comment: "features per block (64)" }
  - { name: MHA_TILE_WORDS,     value: "(MHA_TILE_FEATURES * MHA_BANK_ROW_WORDS)", comment: "packed activation words per tile (64*7=448, one BRAM36)" }
  - { name: MHA_ROWS_PER_STEP,  value: 1,  comment: "output rows the lanes advance together (amortises per-row block imbalance)" }
  - { name: MHA_TILE_ENTRY_BITS, value: 16, comment: "packed weight entry: {block-local column (6 b), value (4 b)}" }
  - { name: MHA_TILE_PACK,      value: 4,  comment: "weight entries per 64-bit bank word" }
  # A stage computes MHA_FEATURE_HEAD output rows, so a bank holds one (row block x column block)
  # cell, not a whole column block: measured worst cell = 977 entries (w_q) against 9704 for a
  # whole block.  The +MHA_TILE_PACK is because the burst starts at the word CONTAINING the cell's
  # first entry, so up to MHA_TILE_PACK-1 entries of the previous cell sit in front of it.
  - { name: MHA_ROW_BLOCKS,     value: "(MHA_FEATURE_W_MAX / MHA_FEATURE_HEAD)", comment: "row blocks per weight (12; a block = one head's rows)" }
  # The engine is shared with the MLP, whose W2 has 256-wide column blocks and denser cells, so the
  # bank is sized for the largest user: measured worst cell 2196 (W2) against 977 (MHA w_q).
  # The nonzero counts are read this many per transfer: one byte each, so a row block's counts cost
  # MHA_TILES * MHA_FEATURE_HEAD / MHA_COUNT_PACK reads instead of one per count.  The blob starts
  # with the per-column-block DDR offsets as int32, padded to a whole word.
  - { name: MHA_COUNT_PACK,     value: 8, comment: "counts per transfer when reading them from DDR; 64-bit transfers, since 128-bit ones cost ~5.5k LUT more in the memory interface for ~5k cycles per layer" }
  - { name: MHA_COUNT_WORD_BITS, value: "(MHA_COUNT_PACK * 8)", comment: "width of one count transfer" }
  - { name: MHA_COUNT_HDR_WORDS, value: "((MHA_TILES * 4 + MHA_COUNT_PACK - 1) / MHA_COUNT_PACK)", comment: "words of block offsets in front of the counts" }
  - { name: MHA_TILE_NNZ_MAX,   value: 2560, comment: "per-bank capacity for one row block; worst cell 2196 (MLP W2) + up to 3 lead-in entries" }
  - { name: MHA_TILE_BANK_WORDS, value: "(MHA_TILE_NNZ_MAX / MHA_TILE_PACK)", comment: "bank depth in packed words (640, one URAM)" }

  # --- activation tile regions -----------------------------------------------------------
  # One tile array serves both halves of the layer, in two regions: words [0, MHA_TILE_WORDS) hold
  # the 64 features of an MHA / W1 column block, words [MHA_H_TILE_BASE, ...) hold the 256 hidden
  # features of an MLP W2 column block.  Keeping H in the same memories lets the MLP's second stage
  # read it in place, with no copy between the stages.
  - { name: MHA_H_TILE_FEATURES, value: 256, comment: "hidden features per W2 column block (d_h / MHA_TILES)" }
  - { name: MHA_H_TILE_WORDS,    value: "(MHA_H_TILE_FEATURES * MHA_BANK_ROW_WORDS)", comment: "packed words of one H tile (256*7=1792)" }
  - { name: MHA_H_TILE_BASE,     value: "MHA_TILE_WORDS", comment: "first word of the H region inside a tile" }
  - { name: MHA_TILE_WORDS_MAX,  value: "(MHA_TILE_WORDS + MHA_H_TILE_WORDS)", comment: "tile depth covering both regions (2240, one URAM)" }

  # --- per-head attention working state ------------------------------------------
  - { name: MHA_SCR_A_CNT,      value: "(MHA_FEATURE_HEAD * MHA_FEATURE_HEAD)", comment: "per-head A = K'V^T (int32)" }

  # --- loop tripcounts: latency ESTIMATION only (90% weight + activation sparsity)
  - { name: MHA_TC_FEATURE,      value: 768, comment: "feature rows (projections)" }
  - { name: MHA_TC_TOKEN,        value: 50, comment: "tokens / dense width" }
  - { name: MHA_TC_FEATURE_HEAD, value: 64,  comment: "per-head width" }
  - { name: MHA_TC_W_NNZ,        value: 77,  comment: "nonzeros per projection weight row (~10% of D)" }
  - { name: MHA_TC_QP_NNZ,       value: 7,   comment: "Q' nonzeros per token-row (~10% of d_head=64)" }
  - { name: MHA_TC_KP_NNZ,       value: 5,  comment: "K' nonzeros per feature-row (~10% of n=50)" }

types:
  - { name: T_MhaWVal,  kind: ap_uint,  width: 8,            comment: "raw value field of a packed weight entry: 4-bit POT code, or an 8-bit plain integer weight" }
  - { name: T_MhaWCol,  kind: ap_uint,  width: 10,           comment: "on-chip decoded W col buffer (feature < MHA_FEATURE_W_MAX=768)" }
  - { name: T_MhaHeadIndex, kind: ap_uint, width: 8,         comment: "Q'/K' CSR col idx: K'=token(0..196), Q'=BAND-LOCAL feature(0..63) after head-major emit -> both fit 8 bits" }
  - { name: T_MhaBankWord, kind: ap_uint, width_expr: "MHA_BANK_WORD_BITS", comment: "packed bank URAM word: MHA_BANK_PACK int8 activations (64-bit)" }
  - { name: T_MhaTileWord, kind: ap_uint, width_expr: "(MHA_TILE_PACK * MHA_TILE_ENTRY_BITS)", comment: "packed weight-bank word: MHA_TILE_PACK entries of {col, val} (64-bit)" }
  - { name: T_MhaTileCol,  kind: ap_uint, width: 8,  comment: "block-local column: 0..63 for the MHA and W1, 0..255 for the MLP's W2 blocks" }
  - { name: T_MhaTileCount, kind: ap_uint, width: 8, comment: "nonzeros of one output row inside one block (measured max 62)" }
  - { name: T_MhaCountWord, kind: ap_uint, width_expr: "MHA_COUNT_WORD_BITS", comment: "one DDR transfer of MHA_COUNT_PACK counts, or of the int32 block offsets" }
  - { name: T_MhaAcc,   kind: ap_int,   width: 32,           comment: "MAC / scatter accumulator (int8xint8 summed)" }
  - { name: T_MhaRecip, kind: ap_ufixed, total: 32, int: 1,  comment: "1/(d+eps) reciprocal LUT output; d is large so recip ~1e-6, needs many frac bits" }
  - { name: T_MhaDiv,   kind: ap_fixed, total: 32, int: 16,  comment: "N*recip ~= N/d ratio (O(1)) before requant" }
